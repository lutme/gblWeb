
name: Deploy gblWeb

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 安装 pnpm 12.16.1
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      # 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # 安装依赖
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 构建 Vue 项目
      - name: Build
        run: pnpm build

      # 配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 上传 dist
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # 发布网站
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
